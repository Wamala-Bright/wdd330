<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Page</title>
  <link rel="stylesheet" href="profile.css">
</head>
<body>
  <div class="profile-container">
    <div class="profile-card">
      <img src="profile.webp" alt="User Avatar" class="avatar">
      <h2 class="username" id="displayName">John Doe</h2>
      <p class="email" id="displayEmail">johndoe@example.com</p>
      <p class="bio" id="displayBio">Web developer passionate about building responsive and user-friendly applications.</p>
    </div>

    <div class="profile-form">
      <h3>Edit Profile</h3>
      <form id="profileForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="bio">Bio</label>
        <textarea id="bio" placeholder="Write something about yourself"></textarea>

        <button type="submit">Save Changes</button>
      </form>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
